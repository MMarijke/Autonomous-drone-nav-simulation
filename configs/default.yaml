# Default configuration for the drone navigation simulator.
# Every number used by the simulation lives here; override from the CLI with
#   --set section.key=value   (e.g. --set world.size=[40,40,14] --set rl.lr=3e-4)

seed: 0

world:
  size: [32.0, 32.0, 12.0]        # metres (x, y, z)
  resolution: 1.0                 # voxel edge used by the planners (m)
  static:
    building_prob: 0.6            # P(ground-anchored building) vs floating block
    building_footprint: [1.5, 4.5]
    building_height: [3.0, 10.0]
    block_footprint: [1.5, 4.0]
    block_height: [1.5, 3.5]
  dynamic:
    radius: [0.5, 0.9]
    speed: [1.5, 3.0]
    wander: 0.5                   # random velocity perturbation (rad/s)
    corridor_bias: 0.75           # fraction spawned around the start-goal line, flying across it
    corridor_sigma: 2.5           # m, lateral spread of corridor traffic
  start_goal:
    min_distance: 20.0
    clearance: 2.0                # min distance start/goal -> any obstacle
    zone_depth: 3.0               # start/goal sampled this close to the x-edges
    dynamic_keepout: 4.0          # no dynamic obstacle spawns this close
    max_attempts: 40

# Named obstacle budgets used for evaluation and demos.
scenarios:
  easy:   {static: 14, dynamic: 0}
  medium: {static: 24, dynamic: 6}
  hard:   {static: 34, dynamic: 12}

# Training curriculum: difficulty in [0, 1] interpolates between [min, max].
curriculum:
  static: [6, 28]
  dynamic: [0, 8]

drone:
  radius: 0.3
  max_speed: 3.0                  # m/s
  max_accel: 6.0                  # m/s^2
  dt: 0.1                         # s

sensors:
  camera:                         # forward depth camera (range image)
    width: 40
    height: 24
    hfov_deg: 100.0
    vfov_deg: 60.0
    max_range: 10.0
    noise_std: 0.03
    dropout: 0.005
  rangefinder:                    # 18 rays, aligned with the action directions
    max_range: 10.0
    noise_std: 0.03

vision:
  danger_range: 5.0               # pixels closer than this count as obstacle
  min_blob_area: 3                # px
  median_ksize: 3
  pool_grid: [3, 5]               # rows x cols of the min-pooled depth feature

task:
  goal_radius: 1.0
  max_steps: 400
  near_miss: 0.5                  # clearance (m) below which we count a near miss

planner:                          # A* baseline
  inflation: 1.0                  # obstacle inflation (m) = radius + margin
  heuristic_weight: 1.2           # 1.0 = optimal A*, >1 = faster, bounded-suboptimal
  perception: sensed              # sensed | oracle (oracle sees true dynamic obstacles)
  static_filter_margin: 0.75      # depth hits this close to a known obstacle are static
  dynamic_ttl: 1.2                # s a sensed dynamic voxel stays blocked
  dynamic_inflate: 1.5            # m, block radius around a sensed dynamic hit
  dynamic_depth: 0.5              # m, push hit point along the ray towards the body centre
  replan_interval: 5              # steps
  lookahead: 2.5                  # m, pure-pursuit distance
  cruise_speed: 3.0
  deviation_replan: 2.5           # m off the path -> replan
  safety:
    enabled: true
    margin: 0.5                   # extra clearance on top of drone radius
    brake_decel: 4.5              # m/s^2 assumed for the stopping-distance rule
    repulse_range: 0.9            # m, centre-to-surface distance where repulsion kicks in
    repulse_gain: 2.0

guidance:                         # global guidance fed to the RL policy
  inflation: 1.6                  # m, wider than the planner's: leaves room for local manoeuvring
  lookahead: 4.0                  # m ahead on the A* path (hybrid agent)
  deviation_replan: 3.0

rl:
  hidden: [256, 256]
  gamma: 0.99
  n_step: 3
  lr: 5.0e-4
  lr_end: 5.0e-4                  # cosine-decayed to this value over training (= lr: no decay)
  batch_size: 128
  buffer_size: 200000
  learning_starts: 5000
  train_every: 2                  # env steps per gradient step
  target_tau: 0.01                # Polyak averaging coefficient
  grad_clip: 10.0
  eps: {start: 1.0, end: 0.05, decay_frac: 0.5}
  total_steps: 300000
  curriculum_frac: 0.6            # fraction of training over which difficulty ramps to 1
  eval_every: 25000
  eval_episodes: 20
  eval_scenario: medium
  log_every_episodes: 50
  reward:
    progress: 1.0                 # per metre of progress along the guidance
    step: 0.02
    proximity: 0.3
    safe_dist: 1.0                # m, gap below which the proximity penalty applies
    collision: 15.0
    goal: 15.0
    timeout: 2.0
    scale: 0.1                    # global reward scale (keeps Q-values ~O(1))

eval:
  episodes: 100
  seed_offset: 20000              # benchmark worlds: disjoint from training (<10000) and checkpoint selection (10000+)

viz:
  width: 1360
  height: 760
  fps: 20
  trail_length: 200
  orbit_azimuth_deg: 35.0
  orbit_elevation_deg: 32.0
  orbit_speed_deg_per_s: 6.0
  show_rays: true
